# HTTP: ACME challenge + redirect to HTTPS.
server {
    listen 80;
    server_name b2b.paradise.kz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Next.js B2B portal for partner stores (SSR; server-side API calls go
# through the internal nginx:8080 listener, see API_URL_INTERNAL).
server {
    listen 443 ssl;
    http2 on;
    server_name b2b.paradise.kz;

    ssl_certificate /etc/letsencrypt/live/b2b.paradise.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/b2b.paradise.kz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /var/log/nginx/b2b.access.log;
    error_log /var/log/nginx/b2b.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://b2b-portal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
