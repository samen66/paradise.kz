name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-test:
    name: Backend Tests (PHPUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none
      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"
      - name: Generate key
        run: php artisan key:generate
      - name: Run PHPUnit
        run: php artisan test --parallel

  frontend-typecheck:
    name: Frontend Typecheck & Build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [storefront, b2b-portal, admin]
    defaults:
      run:
        working-directory: ./${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Same major as the node:22-alpine production images.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './${{ matrix.app }}/package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Run Typecheck
        run: npx tsc --noEmit
      # The build must succeed with no reachable API (pages that fetch at
      # request time render on demand, not at build time).
      - name: Build
        run: npm run build
        env:
          API_URL_INTERNAL: http://127.0.0.1:1/api
          NEXT_PUBLIC_API_URL: https://api.paradise.kz/api
          NEXT_PUBLIC_SITE_URL: https://shop.paradise.kz
