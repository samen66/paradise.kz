services:
  app:
    build: .
    volumes:
      - .:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: paradise
      DB_USERNAME: paradise
      DB_PASSWORD: secret
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: paradise
      MYSQL_USER: paradise
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  vite:
    image: node:22-alpine
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/var/www/html
      - /var/www/html/node_modules
    ports:
      - "5174:5173"

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5175:5173"
    environment:
      API_TARGET: http://nginx
    depends_on:
      - nginx

  # B2C storefront (Next.js). Server-side fetches go through the docker
  # network (API_URL_INTERNAL), browser requests through the published
  # nginx port.
  storefront:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --webpack"
    volumes:
      - ./storefront:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      NODE_OPTIONS: "--max-old-space-size=4096"
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      API_URL_INTERNAL: http://nginx/api
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      - nginx

  queue:
    build: .
    command: php artisan queue:listen --tries=3
    volumes:
      - .:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: paradise
      DB_USERNAME: paradise
      DB_PASSWORD: secret
    depends_on:
      - app

volumes:
  mysql_data:
